[workspace]
resolver = "2"
members = ["crates/pixelguard-cli", "crates/pixelguard-core"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/emiliodominguez/pixelguard"
authors = ["Pixelguard Contributors"]

[workspace.dependencies]
# Core dependencies
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["full"] }

# Image processing
image = "0.25"

# CLI
clap = { version = "4.6", features = ["derive"] }

# HTTP client
reqwest = { version = "0.13", features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File system
walkdir = "2.5"
glob = "0.3"
tempfile = "3.27"

# HTTP server
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }

# Open browser
open = "5.3"

# Regex
regex = "1.12"

# Base64 encoding
base64 = "0.22"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Interactive CLI
dialoguer = "0.12"

# Testing
assert_cmd = "2.2"
predicates = "3.1"
